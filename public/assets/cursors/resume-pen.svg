<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="penShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g filter="url(#penShadow)">
    <!-- Fine Nib Tip at (1,1) -->
    <path d="M 1 1 L 7 4 L 4 7 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="0.8"/>
    <!-- Gold Nib Body -->
    <path d="M 7 4 L 14 11 L 11 14 L 4 7 Z" fill="#fbbf24" stroke="#b45309" stroke-width="0.8"/>
    <!-- Nib slit -->
    <line x1="2" y1="2" x2="9" y2="9" stroke="#78350f" stroke-width="0.8"/>
    <circle cx="8" cy="8" r="0.7" fill="#78350f"/>
    <!-- Pen Collar -->
    <path d="M 14 11 L 16 13 L 13 16 L 11 14 Z" fill="#475569" stroke="#1e293b" stroke-width="0.8"/>
    <!-- Pen Shaft (Matte Indigo Barrel) -->
    <path d="M 16 13 L 26 23 C 27 24, 27 26, 25 27 C 24 28, 22 28, 21 27 L 13 16 Z" fill="#1e293b" stroke="#0f172a" stroke-width="0.8"/>
    <!-- Chrome Ring Highlight -->
    <line x1="17" y1="14" x2="14" y2="17" stroke="#94a3b8" stroke-width="1.2"/>
  </g>
</svg>
