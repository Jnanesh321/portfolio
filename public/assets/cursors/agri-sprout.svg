<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="sproutGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.2" flood-color="#042f1a" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g filter="url(#sproutGlow)">
    <!-- Main pointer leaf pointing to (2,2) -->
    <path d="M 2 2 C 8 3, 14 7, 16 13 C 18 19, 13 22, 9 20 C 5 18, 1 12, 2 2 Z" fill="#10b981" stroke="#064e3b" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Leaf central spine -->
    <path d="M 3 3 Q 9 10 13 18" stroke="#a7f3d0" stroke-width="1" stroke-linecap="round" fill="none"/>
    <!-- Secondary golden seed leaf -->
    <path d="M 12 12 C 16 9, 23 10, 24 14 C 25 18, 20 20, 15 18 Z" fill="#f59e0b" stroke="#78350f" stroke-width="1" stroke-linejoin="round"/>
    <!-- Sprout stem -->
    <path d="M 11 19 Q 12 25 14 28" stroke="#059669" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
