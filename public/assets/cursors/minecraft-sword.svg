  <rect x="1" y="3" width="1" height="2" fill="#146c5f"/>
  <rect x="4" y="2" width="2" height="2" fill="#2cf5d6"/>
  <rect x="2" y="4" width="2" height="2" fill="#1ea994"/>
  
  <!-- Diagonal Blade Body -->
  <rect x="4" y="4" width="2" height="2" fill="#5bf9e2"/>
  <rect x="6" y="4" width="2" height="2" fill="#2cf5d6"/>
  <rect x="4" y="6" width="2" height="2" fill="#1ea994"/>
  <rect x="6" y="2" width="2" height="2" fill="#146c5f"/>
  <rect x="2" y="6" width="2" height="2" fill="#146c5f"/>

  <rect x="6" y="6" width="2" height="2" fill="#5bf9e2"/>
  <rect x="8" y="6" width="2" height="2" fill="#2cf5d6"/>
  <rect x="6" y="8" width="2" height="2" fill="#1ea994"/>
  <rect x="8" y="4" width="2" height="2" fill="#146c5f"/>
  <rect x="4" y="8" width="2" height="2" fill="#146c5f"/>

  <rect x="8" y="8" width="2" height="2" fill="#5bf9e2"/>
  <rect x="10" y="8" width="2" height="2" fill="#2cf5d6"/>
  <rect x="8" y="10" width="2" height="2" fill="#1ea994"/>
  <rect x="10" y="6" width="2" height="2" fill="#146c5f"/>
  <rect x="6" y="10" width="2" height="2" fill="#146c5f"/>

  <rect x="10" y="10" width="2" height="2" fill="#5bf9e2"/>
  <rect x="12" y="10" width="2" height="2" fill="#2cf5d6"/>
  <rect x="10" y="12" width="2" height="2" fill="#1ea994"/>
  <rect x="12" y="8" width="2" height="2" fill="#146c5f"/>
