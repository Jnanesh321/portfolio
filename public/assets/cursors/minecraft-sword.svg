  <rect x="15" y="12" width="2" height="2" fill="#146c5f"/>
  <rect x="12" y="15" width="2" height="2" fill="#146c5f"/>

  <!-- Handle -->
  <rect x="16" y="16" width="3" height="3" fill="#6d4c28"/>
  <rect x="18" y="18" width="3" height="3" fill="#51371c"/>
  <!-- Pommel -->
