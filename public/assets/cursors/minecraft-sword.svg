  <rect x="12" y="12" width="2" height="2" fill="#5bf9e2"/>
  <rect x="14" y="12" width="2" height="2" fill="#2cf5d6"/>
  <rect x="12" y="14" width="2" height="2" fill="#1ea994"/>

  <!-- Guard Cross -->
  <rect x="14" y="10" width="2" height="4" fill="#2cf5d6"/>
